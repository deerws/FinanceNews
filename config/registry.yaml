# =============================================================
# REGISTRY DE FONTES — Cartas de Gestores
# Fonte da verdade consumida pelo crawler (financenews).
#
# Origem: levantamento feito em conversa separada (claude.ai web),
# materializado aqui em 2026-08-02. Campos `verificado`/`notas` de
# algumas fontes foram atualizados nesta data com achados reais de
# implementação (ver histórico de notas "[2026-08-02]").
#
# Campos:
#   tier        1 = core (ler sempre) | 2 = rotação | 3 = eventual
#   trilha      equity_br | macro_br | global | complemento
#   cadencia    mensal | trimestral | semestral | anual | irregular | semanal | diaria
#   janela      dias do mês em que costuma publicar (para agendar o crawl)
#   url         página índice das cartas
#   verificado  true  = URL confirmada (existe / é alcançável)
#               false = precisa descoberta manual antes do primeiro crawl
#   coleta      pattern_wp | scrape_index | mz_api | gated | manual | rss
#   implementado true = tem estratégia de coleta funcionando no v1 do crawler
#   notas       armadilhas conhecidas
# =============================================================

meta:
  versao: "0.2"
  perfil: "exploratorio — 2-3h/semana, diagnostico de vertical"
  politica:
    user_agent: "FinanceNews/0.1 (+paes.andre33@gmail.com; projeto pessoal de acompanhamento de cartas de gestores)"
    respeitar_robots: true
    delay_entre_requests_seg: 3
    max_requests_por_dominio_dia: 50

# -------------------------------------------------------------
# AGREGADOR — usar como fonte de DESCOBERTA e validação cruzada
# -------------------------------------------------------------
agregadores:
  - nome: Quem Tem Boca Investe
    url: https://quemtembocainveste.com.br/cartas
    verificado: true
    coleta: scrape_index
    notas: >
      Cataloga cartas mensais de gestoras BR com link para o PDF original.
      Excelente para descobrir URLs canônicas e detectar novas publicações.
      Checar termos de uso antes de crawlear com frequência. Preferir sempre
      baixar do site da gestora, usando o agregador só como índice.

# -------------------------------------------------------------
