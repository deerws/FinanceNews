    coleta: rss
    implementado: false

# =============================================================
# CALENDÁRIO DE CRAWL SUGERIDO
# =============================================================
agendamento:
  diario_leve:
    horario: "07:00"
    alvos: [complemento, tier_1_rss]
  janela_cartas_mensais:
    dias_do_mes: [1, 3, 5, 8, 10, 12, 28, 30]
    alvos: [macro_br]
    notas: "Concentração real: dias 1-12 (mês anterior) e final do mês."
  janela_cartas_trimestrais:
    meses: [1, 2, 4, 5, 7, 8, 10, 11]
    frequencia: semanal
    alvos: [equity_br]
    notas: "Trimestrais saem 30-60 dias após o fechamento. Varrer semanalmente."
  irregulares:
    frequencia: "2x por semana"
    alvos: [oaktree_marks, squadra, atmos]

# =============================================================
# PIPELINE MÍNIMO
# =============================================================
pipeline:
  - fetch: "HEAD antes de GET; respeitar delay"
  - dedupe: "sha256 do binário + (gestora, ano, mes) como chave lógica"
  - storage: "cartas/{trilha}/{gestora}/{AAAA}-{MM}-{slug}.{pdf|txt}"
  - extract: "pdfplumber (PDF) ou limpeza de HTML (posts) → .txt ao lado do original"
  - index: "cartas/index.json com metadados + status de leitura (lido/pendente)"
  - alerta: "só notificar quando houver documento novo em tier 1 (não implementado no v1)"
