  - id: verde
    nome: Verde Asset
    tier: 1
    trilha: macro_br
    cadencia: mensal
    janela: "01-08"
    url: https://www.verdeasset.com.br
    verificado: true
    coleta: pattern_wp
    implementado: false
    padrao_pdf: "https://www.verdeasset.com.br/public/files/rel_gestao/{FUNDO_ID}/{Nome}-REL-{AAAA}_{MM}.pdf"
    notas: >
      [2026-08-02] Site é uma SPA (gerador "Infront 1.0") — o HTML inicial
      não traz nenhum link, conteúdo é montado por JS a partir de dados
      carregados depois (core.js/router.js não expõem endpoint óbvio numa
      inspeção rápida). Precisa de investigação mais profunda (achar a
      chamada JSON real, ou renderização via browser headless) antes de
      dar pra implementar com HTTP simples. Fora do v1 por isso — não é
      falta de tentativa, é um site genuinamente mais difícil que os outros.
      [2026-08-02] Reteste: mesmo resultado, sem mudança.

  - id: kinea
    nome: Kinea
    tier: 1
    trilha: macro_br
    cadencia: mensal
    janela: "final do mês"
    url: https://www.kinea.com.br/blog/categoria/carta-do-gestor/
    verificado: true
    coleta: scrape_index
    implementado: true
    notas: >
      [2026-08-02] Confirmado: NÃO publica PDF — cada carta é um post HTML.
      Melhor via REST API do WordPress:
      https://www.kinea.com.br/wp-json/wp/v2/posts?categories=340
      (340 = id da categoria "carta do gestor", obtido do header Link da
      página índice). Retorna JSON com content.rendered em HTML; extração
      é limpeza de HTML → texto, não pdfplumber.

  - id: kapitalo
    nome: Kapitalo
    tier: 1
    trilha: macro_br
    cadencia: mensal
    janela: "08-12"
    url: https://www.kapitalo.com.br
    verificado: true
    coleta: pattern_wp
    implementado: false
    padrao_pdf: "https://www.kapitalo.com.br/wp-content/uploads/2022/09/Carta-do-Gestor_K10-{Mes}{AAAA}.pdf"
    notas: >
      ATENÇÃO: o path de upload está congelado em 2022/09 mesmo para cartas
      novas. Não inferir pela data — scrapear o índice.
      [2026-08-02] Tentei scrapear o índice: nem a home, nem /cartas-do-gestor,
      nem /cartas-do-gestor/cartas-tematicas, nem a página do fundo K10 têm
      link estático pra carta mensal (só material informativo/regulamento).
      Site não é SPA (WordPress + jQuery normal) — carta provavelmente é
      carregada via AJAX/admin-ajax.php disparado por interação, ou fica
      atrás de área logada. Precisaria inspecionar o JS de verdade (scripts.js)
      pra achar o endpoint — não investido ainda.

  - id: jgp
    nome: JGP
    tier: 2
    trilha: macro_br
    cadencia: mensal
    janela: "05-10"
    url: https://jgp.com.br
    verificado: true
    coleta: pattern_wp
    implementado: false
    padrao_pdf: "https://jgp.com.br/wp-content/uploads/{AAAA}/{MM}/JGP_Carta-Macroeconomica_{Mes}{AA}.pdf"
    notas: >
      [2026-08-02] Conexão HTTPS falha consistentemente neste ambiente
      (TLS handshake não completa, falha antes de qualquer resposta HTTP —
      não é 403/bloqueio de UA, é a nível de conexão). HTTP puro dá 301
      pra HTTPS, que falha do mesmo jeito. Hipótese: WAF bloqueando faixa
      de IP de nuvem/datacenter — pode simplesmente funcionar rodando de
      uma rede residencial normal. Vale testar de novo da sua máquina antes
      de investir mais tempo nisso. Fora do v1 por ora, substituída por
      Novus no lote inicial.

