  - id: kinitro
    nome: Kínitro Capital
    tier: 3
    trilha: macro_br
    cadencia: mensal
    url: https://www.kinitro.com.br
    verificado: true
    coleta: pattern_wp
    implementado: false
    padrao_pdf: "https://www.kinitro.com.br/documentos/cartas/{AAAA}/{MM}/Carta Mensal Kínitro - {Mes}.{AA}.pdf"
    notas: >
      Acento no path — cuidado com encoding UTF-8.
      [2026-08-02] Falso positivo inicial: uma URL de teste devolveu 200 com
      um header que parecia real (accept-ranges: bytes), mas era o shell
      HTML vazio do site (SPA, ~2KB, mesmo conteúdo pra qualquer path —
      confirmado comparando bytes). Mesma categoria de bloqueio da Verde.
      O crawler agora valida content-type antes de aceitar um hit de
      pattern_wp, então isso não baixa lixo — só não acha nada.

  - id: garde
    nome: Garde
    tier: 3
    trilha: macro_br
    cadencia: mensal
    url: https://www.garde.com.br/cartas-ao-gestor
    verificado: true
    coleta: scrape_index
    implementado: false
    notas: >
      [2026-08-02] Handshake TLS falha (SSL alert "handshake failure") direto
      na conexão, antes de qualquer HTTP — diferente do bloqueio do JGP
      (que nem chega a fazer handshake). Pode ser incompatibilidade de
      cipher/versão TLS do lado deles, não necessariamente bloqueio
      intencional. Vale retestar de outra rede antes de investir mais.

