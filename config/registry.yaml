fontes:

  - id: dynamo
    nome: Dynamo
    tier: 1
    trilha: equity_br
    cadencia: trimestral
    janela: "~30-60 dias após fim do trimestre"
    url: https://www.dynamo.com.br/2436-2/
    verificado: true
    coleta: scrape_index
    implementado: true
    notas: >
      [2026-08-02] URL antiga do registry (/cartas-dynamo) hoje faz 301 para
      /2436-2/ — atualizado aqui. Estrutura real: a página índice lista PDFs
      diretos em wp-content/uploads/{AAAA}/{MM}/ para a maioria das cartas
      recentes (ex.: Carta-Dynamo-127.pdf), mas a carta mais nova às vezes só
      tem link para sua landing page própria (/carta-{N}-slug/), cujo PDF
      precisa ser resolvido com um fetch adicional a essa página. Ano/mês
      extraídos do path de upload (/uploads/AAAA/MM/), não do nome do
      arquivo. robots.txt permissivo; sitemap em /wp-sitemap.xml como
